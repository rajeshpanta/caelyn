name: Caelyn
options:
  # Bundle ID prefix — needs to be unique to your Apple Developer team.
  # If you're on a paid Apple Developer Program, you can use your own
  # reverse-domain (e.g. com.yourdomain).
  bundleIdPrefix: smallpanta-icould.com
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Ships as 1.0 — the App Store Connect version record is 1.0, and nothing has
    # ever been released, so the earlier 1.0.1 uploads are just unused pre-release
    # builds sitting in Connect.
    MARKETING_VERSION: "1.0"
    # Build numbers must rise within a version train. 1.0 is a fresh train (its
    # builds are separate from the 1.0.1 ones), but this stays strictly above the
    # highest number used anywhere so no upload can ever collide. Bump it before
    # every upload, and keep the widget/watch CFBundleVersion below identical — a
    # mismatch between the app and its embedded bundles trips ITMS-90473.
    CURRENT_PROJECT_VERSION: 7
    DEVELOPMENT_TEAM: "7T9897GFKH"

targets:
  Caelyn:
    type: application
    platform: iOS
    sources:
      - path: Caelyn
    # ────────────────────────────────────────────────────────────────────
    # App Group — required for WidgetKit data sharing.
    # Register group.smallpanta-icould.com.caelynperiodtracker in
    # developer.apple.com → Identifiers → App Groups before building
    # with a provisioning profile. Automatic signing handles it once
    # the group exists in the portal.
    #
    # HealthKit: uncomment the healthkit lines below (both at once) if
    # enabling HealthKit. The App Group entitlement must stay uncommented
    # regardless of HealthKit status because WidgetKit requires it.
    entitlements:
      path: Caelyn/Caelyn.entitlements
      properties:
        com.apple.security.application-groups:
          - group.smallpanta-icould.com.caelynperiodtracker
        # iCloud entitlements intentionally removed — Caelyn is local-only until
        # the real private-CloudKit backup lands (stz-003 / Phase 6). Keep this in
        # sync with Caelyn/Caelyn.entitlements.
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.usernotifications.time-sensitive: true
    dependencies:
      - target: CaelynWidget
        embed: true
      - target: CaelynWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: smallpanta-icould.com.caelynperiodtracker
        DEVELOPMENT_ASSET_PATHS: '"Caelyn/Preview Content"'
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: "Caelyn"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Caelyn uses Face ID to keep your cycle data private."
        # HealthKit usage strings — required even when the entitlement is OFF,
        # because the binary still contains references to HealthKit APIs in
        # Services/. Apple's static analyzer rejects uploads (ITMS-90683)
        # without these strings. Re-comment these only if all HealthKit
        # symbols are removed from the binary.
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Caelyn reads menstrual flow history and Apple Watch wrist temperature from Apple Health to improve cycle predictions when you choose to connect."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Caelyn writes your menstrual flow and symptoms to Apple Health when you choose to."
        # Export compliance. Caelyn uses only Apple-provided encryption (the
        # Keychain for the PIN hash, plus OS-level device encryption) and ships no
        # crypto of its own, which is exempt. Declaring it here answers the
        # question at build time instead of being prompted on every single upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"

  CaelynTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CaelynTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: smallpanta-icould.com.caelynperiodtracker.tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Caelyn.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Caelyn"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Caelyn

  CaelynUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CaelynUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: smallpanta-icould.com.caelynperiodtracker.uitests
        TEST_TARGET_NAME: Caelyn
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Caelyn

  CaelynWidget:
    type: app-extension
    platform: iOS
    # Sources: all files in CaelynWidget/ plus the shared WidgetDataStore
    # (pure Foundation — no SwiftData/PredictionEngine/etc.).
    sources:
      - path: CaelynWidget
      - path: Caelyn/Services/WidgetDataStore.swift
    info:
      path: CaelynWidget/Info.plist
      properties:
        CFBundleDisplayName: CaelynWidget
        CFBundleVersion: "7"
        CFBundleShortVersionString: "1.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: CaelynWidget/CaelynWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.smallpanta-icould.com.caelynperiodtracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: smallpanta-icould.com.caelynperiodtracker.widget
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: "7T9897GFKH"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_VERSION: "5.0"

  CaelynWatch:
    type: application
    platform: watchOS
    # NOTE: the `deploymentTarget:` key below does NOT reach the generated
    # pbxproj (xcodegen emits no WATCHOS_DEPLOYMENT_TARGET for it), so the build
    # silently fell back to the SDK version — shipping a Watch app installable
    # only on the newest watchOS. WATCHOS_DEPLOYMENT_TARGET in settings.base
    # below is the one that actually takes effect; keep the two in sync and
    # verify `MinimumOSVersion` in the built Watch app's Info.plist after any
    # change here.
    deploymentTarget:
      watchOS: "10.0"
    sources:
      - path: CaelynWatch
      - path: Caelyn/Services/WidgetDataStore.swift
    info:
      path: CaelynWatch/Info.plist
      properties:
        CFBundleDisplayName: Caelyn
        CFBundleVersion: "7"
        CFBundleShortVersionString: "1.0"
        WKApplication: true
        WKCompanionAppBundleIdentifier: smallpanta-icould.com.caelynperiodtracker
    entitlements:
      path: CaelynWatch/CaelynWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.smallpanta-icould.com.caelynperiodtracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: smallpanta-icould.com.caelynperiodtracker.watchapp
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: "7T9897GFKH"
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  Caelyn:
    build:
      targets:
        Caelyn: all
        CaelynWidget: all
        CaelynWatch: all
        CaelynTests: [test]
        CaelynUITests: [test]
    test:
      config: Debug
      # Same local StoreKit config as `run` (see the note below). Without it the
      # paywall can only ever render its "couldn't load subscription options"
      # state under test, so no UI test can check the tiers or the buy button.
      storeKitConfiguration: Caelyn.storekit
      targets:
        - CaelynTests
        - CaelynUITests
    run:
      config: Debug
      # The .storekit lives at the project root, OUTSIDE the source path,
      # so it is NOT bundled into Release/TestFlight builds. It is used only
      # when running locally from Xcode against the Simulator. Release and
      # TestFlight always talk to real App Store / Sandbox StoreKit.
      storeKitConfiguration: Caelyn.storekit
    archive:
      config: Release
